(function () {

/* ---------------- §0b 老旧内核兜底（现代浏览器走原生，不生效） ---------------- */
if (!Math.hypot) {
  Math.hypot = function () {
    var q = 0;
    for (var i = 0; i < arguments.length; i++) q += arguments[i] * arguments[i];
    return Math.sqrt(q);
  };
}
if (!Element.prototype.closest) {
  Element.prototype.closest = function (sel) {
    var el = this;
    while (el && el.nodeType === 1) {
      if (el.matches && el.matches(sel)) return el;
      el = el.parentElement;
    }
    return null;
  };
}

/* =========================================================================
   《8时46分》—— 无引擎、零依赖、单文件。
   原生 Canvas 2D + requestAnimationFrame，过程式 JS。
   ========================================================================= */

/* ---------------- §0 三条硬约束（⚠ 数值禁止改动） ---------------- */
var PSPEED = 87.5;              // Hard-1  玩家速度恒定 87.5 逻辑像素/秒
var EBASE  = 63;                // Hard-1  敌人速度 = 63 + 2.45 × 已过秒数
var EACC   = 2.45;
var JUDGE  = 0.55;              // Hard-2  判定半径 = 视觉半径 × 0.55（同一个半径变量、同一个系数）
                                // Hard-3  无惯性：位移 = 输入 × 速度 × dt，无加速度/摩擦/缓动/滑行
var DIFF = 1.0;                 // §0c 全局难度总旋钮：1.0 = 对齐台风游戏；0.85 更简单，1.15 更难
                                //     只调这一个数就能整体调档（影响峰值半径与出怪间隔地板）

/* ---------------- §2 设计分辨率与常量 ---------------- */
var W = 400, H = 700, M = 700;
var BX0 = 30, BX1 = 370, BY0 = 30, BY1 = 670;   // §5 位置 clamp 边界
var KN = 44;                                    // §5 摇杆半径（逻辑像素）
var PW = 76, PH = 158;                         // §1 玩家可视占位
var PNP = 60;                                   // §14.3 判定采样点数（仅降级轮廓用）
var DIM = 0.32;                                 // 实景底图压暗系数（0=原图，1=全黑）；0.32 让白客机更跳
var DTMAX = 0.05;                               // §4 dt 上限
var MAXTY = 6;                                  // §12.4 同屏上限（对齐原版：最多 6 架）
var TAU = Math.PI * 2;

/* ---------------- DOM ---------------- */
var cv = document.getElementById('cv'), ctx = cv.getContext('2d');
var stage = document.getElementById('stage'), popup = document.getElementById('popup');
var ptitle = document.getElementById('ptitle'), ptext = document.getElementById('ptext');
var pbtn = document.getElementById('pbtn'), sharebtn = document.getElementById('sharebtn');
var phint = document.getElementById('phint');
var clockEl = document.getElementById('clock');
var pad = document.getElementById('pad'), knob = document.getElementById('knob');
var pausebtn = document.getElementById('pausebtn');

/* ---------------- 缩放（§2：逻辑坐标恒定 400×700，等比缩放居中留黑边） ---------------- */
var SC = 1, K = 1, KR = KN, DPR = 1;
function resize() {
  DPR = window.devicePixelRatio || 1;
  var vw = window.innerWidth, vh = window.innerHeight;
  SC = Math.min(vw / W, vh / H);
  var w = Math.round(W * SC), h = Math.round(H * SC);
  stage.style.width = w + 'px';
  stage.style.height = h + 'px';
  cv.width = Math.round(w * DPR);
  cv.height = Math.round(h * DPR);
  cv.style.width = w + 'px';
  cv.style.height = h + 'px';
  K = cv.width / W;                       // 逻辑坐标 → 设备像素
  KR = KN * SC;                           // 摇杆半径（屏幕像素）
  pad.style.width = pad.style.height = (3 * KR) + 'px';
  knob.style.width = knob.style.height = KR + 'px';
  knob.style.marginLeft = knob.style.marginTop = (-KR / 2) + 'px';
  if (jp) draw();
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', resize);

/* ---------------- §4 时间：1 真实秒 = 1 游戏分钟，只做这一种映射 ---------------- */
var BASE_MIN = 8 * 60 + 46;                     // 526 分钟 = 2001-09-11 08:46
function gameClock(elapsedSec) {
  var total = BASE_MIN + Math.floor(elapsedSec);
  var day = 0;
  while (total >= 1440) { total -= 1440; day++; }   // 跨日兜底
  var h24 = Math.floor(total / 60) % 24;
  var mm = total % 60;
  var h12 = (h24 % 12 === 0) ? 12 : (h24 % 12);
  var period = h24 < 12 ? '上午' : (h24 === 12 ? '中午' : (h24 < 18 ? '下午' : '晚上'));
  return { day: day, h24: h24, mm: mm, h12: h12, period: period };
}
function pad2(n) { n = String(n); return n.length < 2 ? '0' + n : n; }
function hudText(c) { return (c.day > 0 ? '次日' : '9月11日') + ' ' + c.h12 + '时' + pad2(c.mm) + '分'; }
function titleText(c) { return '纽约，2001年9月11日' + (c.day > 0 ? '次日' : '') + ' ' + c.h12 + '时' + pad2(c.mm) + '分'; }

/* ---------------- §6b 地点池：无序集合，纯查表，无状态、无顺序、无去重 ---------------- */
// 只保留双子塔；两枚锚点分别落在塔身自己的左半 / 右半，分界线 = 塔中线 x=199
// 左半中心 199 − 76/4 = 180，右半中心 199 + 76/4 = 218；y 取塔身中心 (279+437)/2 = 358
var SITES = [
  { x: 180, y: 358, name: '纽约世界贸易中心北塔', text: '撞击纽约世界贸易中心北塔' },
  { x: 218, y: 358, name: '纽约世界贸易中心南塔', text: '撞击纽约世界贸易中心南塔' }
];
// 取最近锚点（不用 if-else 顺序链，避免隐式优先级）
function siteOf(px, py) {
  var best = SITES[0], bd = Infinity;
  for (var i = 0; i < SITES.length; i++) {
    var s = SITES[i];
    var d = (s.x - px) * (s.x - px) + (s.y - py) * (s.y - py);
    if (d < bd) { bd = d; best = s; }
  }
  return best;
}

/* ---------------- §3 世界：整屏固定（摄像机不滚、不跟、不缩放），底图见 draw() ---------------- */

/* ---------------- §14 美术资源（唯一允许的两张位图，base64 内嵌） ---------------- */
var ART = { towers: null, plane: null, bg: null };
var READY = false, LOADED = 0, ART_TOTAL = 3, ART_PAD = 0.045;   // ART_PAD = 图内透明边距
function loadArt() {
  var d;
  try { d = JSON.parse(document.getElementById('artdata').textContent); }
  catch (err) { d = {}; console.warn('[art] 资源块解析失败，全部走程序化占位'); }
  function one(key) {
    var img = new Image();
    img.onload = function () { ART[key] = img; artTick(); };
    img.onerror = function () { console.warn('[art] 载入失败，改用程序化占位：' + key); artTick(); };
    img.src = d[key] || '';
  }
  one('towers');
  one('plane');
  one('bg');
}
function artTick() {
  LOADED++;
  if (LOADED < ART_TOTAL) return;
  READY = true;
  pbtn.disabled = false;
  if (!HITM) buildHitMask();
  if (!running && !over) {
    ptitle.textContent = '8时46分';
    ptext.textContent = '拖动世贸双塔，避开从四面八方袭来的客机。\n你躲开的每一秒，都在替纽约走完今天的时刻。';
    phint.hidden = false;
    pbtn.textContent = '开始';
  }
  draw();
}

/* ---------------- 状态 ---------------- */
var jp = null;                       // 玩家中心（逻辑坐标）
var ty = [];                         // 威胁数组
var elapsed = 0, over = false, running = false, spawnT = 0, tyNo = 0;
var paused = false;                  // 用户主动暂停：冻结一切推进
var holdT = 0;                       // 恢复前的反应期（真实秒，不走游戏时间）
var win = false;                     // 隐藏结局：已进入（存活满 60 秒）
var winT = 0;                        // 定格计时（真实秒）
var winShown = false;                // 结局卡是否已弹出
var vx = 0, vy = 0, last = 0, raf = 0, hit = null;
var keys = {};

/* §14.3 玩家判定轮廓：按玩家图同尺寸包围盒沿周长均匀采样 60 点 */
var JPTS = (function () {
  var out = [], per = 2 * (PW + PH), i, d, x, y;
  for (i = 0; i < PNP; i++) {
    d = i * per / PNP;
    if (d < PW) { x = -PW / 2 + d; y = -PH / 2; }
    else if (d < PW + PH) { x = PW / 2; y = -PH / 2 + (d - PW); }
    else if (d < 2 * PW + PH) { x = PW / 2 - (d - PW - PH); y = PH / 2; }
    else { x = -PW / 2; y = PH / 2 - (d - 2 * PW - PH); }
    out.push([x, y]);
  }
  return out;
})();

/* §14.3 判定掩码：只认塔身不透明像素，透明白边一律不算 */
var HITW = 0, HITH = 0, HITM = null, HITPATH = null;
function buildHitMask() {
  if (!ART.towers) return;
  var w = Math.max(1, Math.round(PW)), h = Math.max(1, Math.round(PH));
  var c = document.createElement('canvas');
  c.width = w; c.height = h;
  var g2 = c.getContext('2d');
  g2.clearRect(0, 0, w, h);
  g2.drawImage(ART.towers, 0, 0, w, h);
  var px;
  try { px = g2.getImageData(0, 0, w, h).data; } catch (err) { return; }
  var m = new Uint8Array(w * h), i, x, y;
  for (i = 0; i < w * h; i++) m[i] = px[i * 4 + 3] > 40 ? 1 : 0;
  var p = null;
  try { p = new Path2D(); } catch (e2) { p = null; }
  if (!p) { HITW = w; HITH = h; HITM = m; HITPATH = null; return; }
  for (y = 0; y < h; y++) {
    for (x = 0; x < w; x++) {
      if (!m[y * w + x]) continue;
      if (y === 0 || !m[(y - 1) * w + x]) { p.moveTo(x, y); p.lineTo(x + 1, y); }
      if (y === h - 1 || !m[(y + 1) * w + x]) { p.moveTo(x, y + 1); p.lineTo(x + 1, y + 1); }
      if (x === 0 || !m[y * w + x - 1]) { p.moveTo(x, y); p.lineTo(x, y + 1); }
      if (x === w - 1 || !m[y * w + x + 1]) { p.moveTo(x + 1, y); p.lineTo(x + 1, y + 1); }
    }
  }
  HITW = w; HITH = h; HITM = m; HITPATH = p;
}
function playerHit(t) {
  var rr = t.r * JUDGE, rr2 = rr * rr, j, qx, qy;
  if (!HITM) {
    for (j = 0; j < JPTS.length; j++) {
      qx = jp.x + JPTS[j][0]; qy = jp.y + JPTS[j][1];
      if ((qx - t.x) * (qx - t.x) + (qy - t.y) * (qy - t.y) < rr2) return [qx, qy];
    }
    return null;
  }
  var ox = jp.x - PW / 2, oy = jp.y - PH / 2;
  var ix0 = Math.floor((t.x - rr - ox) / PW * HITW), ix1 = Math.ceil((t.x + rr - ox) / PW * HITW);
  var iy0 = Math.floor((t.y - rr - oy) / PH * HITH), iy1 = Math.ceil((t.y + rr - oy) / PH * HITH);
  if (ix0 < 0) ix0 = 0;
  if (iy0 < 0) iy0 = 0;
  if (ix1 > HITW) ix1 = HITW;
  if (iy1 > HITH) iy1 = HITH;
  for (var iy = iy0; iy < iy1; iy++) {
    for (var ix = ix0; ix < ix1; ix++) {
      if (!HITM[iy * HITW + ix]) continue;
      qx = ox + (ix + 0.5) * PW / HITW; qy = oy + (iy + 0.5) * PH / HITH;
      if ((qx - t.x) * (qx - t.x) + (qy - t.y) * (qy - t.y) < rr2) return [qx, qy];
    }
  }
  return null;
}

/* ---------------- §7 威胁行为模式（转向逻辑照搬框架，基准速度锁在 §0） ---------------- */
var PATS = [
  { name: '直进', segMin: 4.0, segMax: 7.0, jitter: 0.30, pull: 0.2, spd: 1.2, stall: 0 },
  { name: '迷走', segMin: 0.7, segMax: 1.6, jitter: 2.40, pull: 0.2, spd: 0.9, stall: 0 },
  { name: '转向', segMin: 1.5, segMax: 3.0, jitter: 0.30, pull: 0.2, spd: 1.0, stall: 0 },
  { name: '追击', segMin: 1.5, segMax: 3.0, jitter: 0.60, pull: 0.9, spd: 0.8, stall: 0 },
  { name: '滞空', segMin: 1.5, segMax: 3.0, jitter: 1.00, pull: 0.4, spd: 1.3, stall: 0.5 }
];
function toward(t) { return Math.atan2(jp.y - t.y, jp.x - t.x); }
// Hard-1：基准速度 63 + 2.45×已过秒数；模式系数只表达"同速下限内的机种差异"
function enemySpeed(t) {
  var base = EBASE + EACC * elapsed;
  return t.stalled ? base * 0.15 : base * t.spd;
}

/* ---------------- 生成 ---------------- */
function spawn() {
  var s = Math.floor(Math.random() * 4), x, y;
  if (s === 0) { x = Math.random() * W; y = -60; }
  else if (s === 1) { x = W + 60; y = Math.random() * H; }
  else if (s === 2) { x = Math.random() * W; y = H + 60; }
  else { x = -60; y = Math.random() * H; }

  var pat = PATS[Math.floor(Math.random() * PATS.length)];
  var t = {
    no: ++tyNo, pat: pat,
    x: x, y: y,
    r: M * 0.015,                       // 视觉半径（判定一律用它 × 0.55）
    rPeak: (M * 0.043 + Math.random() * M * 0.030) * DIFF,   // 视觉半径 30.1–51.1（判定 16.6–28.1）
    growT: 3 + Math.random() * 3,
    decay: false, entered: false, stalled: false,
    ang: 0, timer: pat.segMin + Math.random() * (pat.segMax - pat.segMin),
    trail: [[x, y]], life: 12 + Math.random() * 10,
    spd: pat.spd,
    fx: x, fy: y, fr: 0
  };
  if (pat.name === '转向') t.bias = (Math.random() < 0.5 ? 1 : -1) * (0.5 + Math.random() * 0.5);
  t.ang = toward(t) + (Math.random() - 0.5) * 0.8;
  setForecast(t);
  ty.push(t);
}

/* ---------------- §9 预判：读实时航向/速度/剩余时长/生长率，向外推演 ---------------- */
function setForecast(t) {
  var v = enemySpeed(t), T = t.timer, r;
  if (t.decay || t.life - T <= 5) r = t.r - t.rPeak * 0.12 * T;
  else r = Math.min(t.rPeak, t.r + t.rPeak / t.growT * T);
  t.fx = t.x + Math.cos(t.ang) * v * T;
  t.fy = t.y + Math.sin(t.ang) * v * T;
  t.fr = Math.max(8.4, r) * JUDGE;      // 预报半径 = max(8.4, 推演半径) × 0.55
}

/* ---------------- 每帧推进 ---------------- */
function update(dt) {
  // 隐藏结局：玩家、飞机、时钟、出怪、判定全部静止，只推进 1.2 秒的真实计时
  if (win) {
    winT += dt;
    if (!winShown && winT >= 1.2) { winShown = true; running = false; showWin(); draw(); }
    return;
  }
  // 暂停 / 反应期：elapsed、jp、ty[]、spawnT、判定与 die() 全部冻结（draw() 照常）
  if (paused) { return; }
  if (holdT > 0) {
    holdT -= dt;
    if (holdT < 0) holdT = 0;
    return;
  }
  if (over) {
    // §8 失败后：全局时间 ×0.3 慢动作（只减速，不再推进游戏时钟、不再接受输入）
    dt *= 0.3;
    for (var q = 0; q < ty.length; q++) {
      var e = ty[q], ev = enemySpeed(e);
      e.x += Math.cos(e.ang) * ev * dt;
      e.y += Math.sin(e.ang) * ev * dt;
    }
    return;
  }

  elapsed += dt;

  // 隐藏结局：先判存活满 60 秒，再做碰撞判定 —— 第 60 秒那一帧即使客机压上来，也判活下来了
  if (!win && elapsed >= 60) { winStart(); return; }

  // 玩家：无惯性，输入直接成速度；撞边即停，不反弹
  jp.x = Math.max(BX0, Math.min(BX1, jp.x + vx * PSPEED * dt));
  jp.y = Math.max(BY0, Math.min(BY1, jp.y + vy * PSPEED * dt));

  // 威胁：转向 / 推进 / 生长 / 衰减 / 消亡
  for (var i = ty.length - 1; i >= 0; i--) {
    var t = ty[i], pt = t.pat;
    t.timer -= dt;
    if (t.timer <= 0) {
      if (pt.stall > 0 && !t.stalled && Math.random() < pt.stall) {
        t.stalled = true;
        t.timer = 1 + Math.random() * 1.5;
      } else {
        t.stalled = false;
        t.timer = pt.segMin + Math.random() * (pt.segMax - pt.segMin);
        var a = toward(t), dd = a - t.ang;
        dd = Math.atan2(Math.sin(dd), Math.cos(dd));
        t.ang += dd * pt.pull + (Math.random() - 0.5) * pt.jitter + (pt.bias || 0);
      }
      t.trail.push([t.x, t.y]);         // 拐点入轨迹
      setForecast(t);
    }

    var v = enemySpeed(t);
    t.x += Math.cos(t.ang) * v * dt;
    t.y += Math.sin(t.ang) * v * dt;
    t.life -= dt;

    if (t.decay || t.life <= 5) t.r -= t.rPeak * 0.12 * dt;
    else if (t.r < t.rPeak) t.r = Math.min(t.rPeak, t.r + t.rPeak / t.growT * dt);
    else if (Math.random() < dt * 0.06) t.decay = true;

    if (t.r <= M * 0.012 || t.life <= 0) {
      ty.splice(i, 1);
    } else if (!t.entered && t.x > 0 && t.x < W && t.y > 0 && t.y < H) {
      t.entered = true;
    } else if ((t.entered && (t.x < -t.r || t.x > W + t.r || t.y < -t.r || t.y > H + t.r)) ||
               t.x < -150 || t.x > W + 150 || t.y < -150 || t.y > H + 150) {
      ty.splice(i, 1);
    }
  }

  // §7 出怪：4 秒收敛到 1.5 秒
  spawnT += dt;
  var interval = Math.max(1.8, 4 - elapsed * 0.08) / DIFF;   // 地板 1.8s：晚期 0.56 架/秒，前 27 秒不变
  if (spawnT > interval && ty.length < MAXTY) { spawnT = 0; spawn(); }

  // §8 判定：玩家轮廓逐点 vs 威胁半径 × 0.55
  for (var k = 0; k < ty.length && !over; k++) {
    var hp = playerHit(ty[k]);
    if (hp) die(hp[0], hp[1]);
  }
}

/* ---------------- §8 失败 ---------------- */
function die(px, py) {
  over = true;
  paused = false; holdT = 0;
  syncPauseIcon();
  pausebtn.hidden = true;                  // 结算期间不提供暂停
  release();                        // 清空输入
  keys = {};
  var c = gameClock(elapsed);
  hit = { site: siteOf(px, py), clock: c };
  setTimeout(function () {
    running = false;
    showResult();
    draw();
  }, 1500);
}

/* ---------------- §10 结算 ---------------- */
function showResult() {
  var c = hit.clock, s = hit.site;
  ptitle.textContent = titleText(c);
  ptext.textContent = '今日' + c.period + '，美国发生一系列严重航空恐怖袭击事件。\n' +
    '美国东部时间' + c.period + c.h12 + '时' + pad2(c.mm) + '分左右，\n' +
    '一架被劫持的民航客机' + s.text + '，\n造成大量人员伤亡。';
  pbtn.textContent = '再来一次';
  sharebtn.hidden = false;
  pausebtn.hidden = true;
  phint.hidden = true;
  popup.classList.remove('hide');
}

/* ---------------- §10b 隐藏结局：存活满 60 秒（08:46 → 09:46） ---------------- */
function winStart() {
  win = true; winT = 0; winShown = false;
  if (paused) { paused = false; holdT = 0; syncPauseIcon(); }   // 停在暂停里也先解除
  release(); keys = {};                    // 清空输入
  pausebtn.hidden = true;                  // 定格期间不提供暂停
}
function showWin() {
  var c = gameClock(elapsed);              // elapsed = 60 → 9时46分
  popup.classList.add('win');
  ptitle.textContent = '纽约，2001年9月11日 上午 ' + c.h12 + '时' + pad2(c.mm) + '分';
  ptext.textContent =
    '纽约的清晨依旧匆忙。\n' +
    '地铁里人们低头看报，咖啡杯冒着热气。\n' +
    '双子塔的影子斜斜铺在街道上，游客举着相机笑，街角的热狗摊排着队。\n' +
    '911从未发生—— 纽约，2001年9月11日 上午' + c.h12 + '时' + pad2(c.mm) + '分';
  pbtn.textContent = '再来一次';
  sharebtn.hidden = false;
  phint.hidden = true;
  popup.classList.remove('hide');
}

/* ---------------- 绘制 ---------------- */
function draw() {
  if (!jp) return;
  ctx.setTransform(K, 0, 0, K, 0, 0);
  // 底：夜空下的海面
  if (ART.bg) {
    ctx.drawImage(ART.bg, 0, 0, W, H);
    ctx.fillStyle = 'rgba(6,10,18,' + DIM + ')';
    ctx.fillRect(0, 0, W, H);
    var vg = ctx.createRadialGradient(W / 2, H / 2, H * 0.32, W / 2, H / 2, H * 0.80);
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(1, 'rgba(0,0,0,.36)');
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, W, H);
  } else {
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#08111c');
    g.addColorStop(0.55, '#091320');
    g.addColorStop(1, '#060c15');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }

  // 陆地与海岸线
  /* 原过程式陆地/海岸线已由实景底图取代 */

  drawPlayer();

  for (var i = 0; i < ty.length; i++) drawThreat(ty[i]);

  clockEl.textContent = hudText(gameClock(elapsed));

  // 隐藏结局：0.9 秒内把画面从冷调缓慢提亮到 +10% 暖白，然后停住（不闪、不跳、不黑屏）
  if (win) {
    var k2 = Math.min(1, winT / 0.9);
    ctx.fillStyle = 'rgba(255,246,232,' + (0.10 * k2) + ')';
    ctx.fillRect(0, 0, W, H);
  }

  // 暂停反馈：整体压暗 18% + 中央暂停符号 + 「已暂停」（每帧重绘，状态天然同步）
  if (paused) {
    ctx.fillStyle = 'rgba(4,7,12,.18)';          // 整体压暗 18%，让"世界停了"一眼可辨
    ctx.fillRect(0, 0, W, H);

    var cy0 = H / 2;
    ctx.strokeStyle = 'rgba(214,231,244,.26)';
    ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.arc(W / 2, cy0, 34, 0, TAU); ctx.stroke();

    ctx.fillStyle = 'rgba(214,231,244,.42)';     // 中央暂停符号：两根竖条
    ctx.fillRect(W / 2 - 8, cy0 - 11, 6, 22);
    ctx.fillRect(W / 2 + 2, cy0 - 11, 6, 22);

    ctx.font = '11px system-ui, -apple-system, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(214,231,244,.50)';
    ctx.fillText('已暂停', W / 2, cy0 + 58);
    ctx.textAlign = 'left';                       // 复位，避免影响后续绘制
  }

  // 恢复那 1 秒：压暗立刻消失，留一个从 40px 收到 6px 的圆环 + 「准备」
  if (holdT > 0) {
    var k3 = holdT;                               // 1 → 0
    ctx.strokeStyle = 'rgba(214,231,244,.30)';
    ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.arc(W / 2, H / 2, 34 * k3 + 6, 0, TAU); ctx.stroke();

    ctx.font = '11px system-ui, -apple-system, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(214,231,244,.42)';
    ctx.fillText('准备', W / 2, H / 2 + 58);
    ctx.textAlign = 'left';
  }
}

function drawPlayer() {
  ctx.save();
  ctx.translate(jp.x, jp.y);
  if (ART.towers) {
    ctx.drawImage(ART.towers, -PW / 2, -PH / 2, PW, PH);   /* 精灵按塔身比例出图，铺满占位框 */
  } else {
    // 降级：程序化双塔
    ctx.fillStyle = '#93a7bb';
    ctx.fillRect(-PW * 0.26, -PH * 0.42, PW * 0.20, PH * 0.84);
    ctx.fillRect(PW * 0.06, -PH * 0.42, PW * 0.20, PH * 0.84);
  }
  // 判定包围盒（低对比提示，让玩家读得出"碰哪里会死"）
  if (HITPATH) {
    ctx.save();
    ctx.translate(-PW / 2, -PH / 2);
    ctx.scale(PW / HITW, PH / HITH);
    ctx.strokeStyle = 'rgba(168,212,240,.42)';   // 可读性：判定轮廓更清楚一点
    ctx.lineWidth = 1.0 * HITW / PW;
    ctx.stroke(HITPATH);
    ctx.restore();
  }
  ctx.restore();
}

function drawThreat(t) {
  var i, p;

  // 轨迹：历次拐点连成折线 + 点标记
  ctx.setLineDash([]);
  ctx.strokeStyle = 'rgba(198,216,232,.30)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (i = 0; i < t.trail.length; i++) {
    p = t.trail[i];
    if (i) ctx.lineTo(p[0], p[1]); else ctx.moveTo(p[0], p[1]);
  }
  ctx.lineTo(t.x, t.y);
  ctx.stroke();
  ctx.fillStyle = 'rgba(198,216,232,.55)';
  for (i = 0; i < t.trail.length; i++) {
    p = t.trail[i];
    ctx.beginPath();
    ctx.arc(p[0], p[1], 2.2, 0, TAU);
    ctx.fill();
  }

  // §9 预判图形（虚线 + 落点双圆 + 公切线锥；纯提示，不参与判定）
  var fx = t.fx, fy = t.fy, len = Math.hypot(fx - t.x, fy - t.y);
  var rs = t.r * JUDGE, rw = t.fr, rf = rw * 0.5;
  ctx.setLineDash([5, 4]);
  ctx.strokeStyle = 'rgba(168,212,240,.45)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(t.x, t.y);
  ctx.lineTo(fx, fy);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(fx, fy, rf, 0, TAU);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.strokeStyle = 'rgba(255,150,150,.50)';
  ctx.beginPath();
  ctx.arc(fx, fy, rw, 0, TAU);
  ctx.stroke();
  if (len > rw - rs) {
    var th = Math.atan2(fy - t.y, fx - t.x);
    var q = (rs - rw) / len;
    if (q >= -1 && q <= 1) {
      var al = Math.acos(q);
      ctx.beginPath();
      for (var sg = -1; sg <= 1; sg += 2) {
        var a2 = th + sg * al;
        ctx.moveTo(t.x + rs * Math.cos(a2), t.y + rs * Math.sin(a2));
        ctx.lineTo(fx + rw * Math.cos(a2), fy + rw * Math.sin(a2));
      }
      ctx.stroke();
    }
  }
  ctx.fillStyle = 'rgba(255,190,190,.75)';
  ctx.beginPath();
  ctx.arc(fx, fy, 1.8, 0, TAU);
  ctx.fill();

  // 威胁实体：几何中心对齐、按航向旋转、机身长度 ≈ 2 × 威胁半径
  ctx.save();
  ctx.translate(t.x, t.y);
  ctx.rotate(t.ang);                       // 图内机头朝右（+x），直接 rotate(ang)
  if (ART.plane) {
    var sl = 2 * t.r / (1 - 2 * ART_PAD);
    ctx.drawImage(ART.plane, -sl / 2, -sl / 2, sl, sl);
  } else {
    ctx.beginPath();
    ctx.moveTo(t.r, 0);
    ctx.lineTo(-t.r * 0.9, t.r * 0.55);
    ctx.lineTo(-t.r * 0.5, 0);
    ctx.lineTo(-t.r * 0.9, -t.r * 0.55);
    ctx.closePath();
    ctx.fillStyle = 'rgba(214,222,232,.85)';
    ctx.fill();
  }
  ctx.restore();

  // 判定圈必须可见：外圈 = 视觉半径，内圈 = 半径 × 0.55
  ctx.lineWidth = 1.2;
  ctx.strokeStyle = 'rgba(255,214,130,.72)';
  ctx.beginPath();
  ctx.arc(t.x, t.y, t.r, 0, TAU);
  ctx.stroke();
  ctx.strokeStyle = 'rgba(255,122,122,.85)';
  ctx.beginPath();
  ctx.arc(t.x, t.y, t.r * JUDGE, 0, TAU);
  ctx.stroke();
}

/* ---------------- 输入（§5）：摇杆 + 键盘；无惯性 ---------------- */
var active = false, pid = null, cx0 = 0, cy0 = 0;
function setKnob(clientX, clientY) {
  var dx = clientX - cx0, dy = clientY - cy0, d = Math.hypot(dx, dy);
  if (d > KR) { dx = dx / d * KR; dy = dy / d * KR; }
  vx = dx / KR;                            // 输入值 ∈ [-1,1]
  vy = dy / KR;                            // ⚠ 斜向不归一化
  knob.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
}
function release() {
  active = false; pid = null; vx = 0; vy = 0;
  knob.style.transform = 'translate(0,0)';
}
function keyVel() {
  vx = (keys.ArrowRight || keys.d ? 1 : 0) - (keys.ArrowLeft || keys.a ? 1 : 0);
  vy = (keys.ArrowDown || keys.s ? 1 : 0) - (keys.ArrowUp || keys.w ? 1 : 0);
}

function onDown(e) {
  if (over || !running || active) return;
  if (e.target.closest('#popup')) return;
  active = true;
  pid = e.pointerId;
  try { stage.setPointerCapture(e.pointerId); } catch (err) {}
  if (e.target.closest('#pad')) {
    var r = pad.getBoundingClientRect();
    cx0 = r.left + r.width / 2;
    cy0 = r.top + r.height / 2;
  } else {
    cx0 = e.clientX;
    cy0 = e.clientY;
  }
  setKnob(e.clientX, e.clientY);
  e.preventDefault();
}
function onMove(e) { if (active && e.pointerId === pid) setKnob(e.clientX, e.clientY); }
function onUp(e) { if (e.pointerId === pid) release(); }

if (window.PointerEvent) {
  stage.addEventListener('pointerdown', onDown, { passive: false });
  stage.addEventListener('pointermove', onMove);
  stage.addEventListener('pointerup', onUp);
  stage.addEventListener('pointercancel', onUp);
} else {
  /* 极老内核兜底：把 touch / mouse 事件翻译成统一形态，摇杆照样能用 */
  function fakeEv(e, id) {
    var t = (e.changedTouches && e.changedTouches[0]) || (e.touches && e.touches[0]) || e;
    return { pointerId: id, clientX: t.clientX, clientY: t.clientY, target: e.target,
             preventDefault: function () { if (e.preventDefault) e.preventDefault(); } };
  }
  stage.addEventListener('touchstart', function (e) {
    onDown(fakeEv(e, e.changedTouches[0].identifier));
  }, { passive: false });
  stage.addEventListener('touchmove', function (e) {
    onMove(fakeEv(e, e.changedTouches[0].identifier));
    if (e.preventDefault) e.preventDefault();
  }, { passive: false });
  stage.addEventListener('touchend', function (e) {
    onUp(fakeEv(e, e.changedTouches[0].identifier));
  });
  stage.addEventListener('touchcancel', function (e) {
    onUp(fakeEv(e, e.changedTouches[0].identifier));
  });
  stage.addEventListener('mousedown', function (e) { onDown(fakeEv(e, 'mouse')); });
  window.addEventListener('mousemove', function (e) { onMove(fakeEv(e, 'mouse')); });
  window.addEventListener('mouseup', function (e) { onUp(fakeEv(e, 'mouse')); });
}

window.addEventListener('keydown', function (e) {
  if (over) return;
  if (e.key === 'p' || e.key === 'P' || e.key === 'Escape') { togglePause(); e.preventDefault(); return; }
  if (!keys[e.key]) { keys[e.key] = true; keyVel(); }
  if (e.key.indexOf('Arrow') === 0) e.preventDefault();
});
window.addEventListener('keyup', function (e) { keys[e.key] = false; keyVel(); });
/* 切窗口：keyup 会丢，清掉按住的键，防止回来时自己往一个方向跑 */
window.addEventListener('blur', function () {
  keys = {}; release();
});

/* ---------------- 暂停键：冻结 / 恢复（不改任何玩法数值） ---------------- */
function syncPauseIcon() {
  var pp = document.getElementById('pic-pause'), pl = document.getElementById('pic-play');
  if (pp) pp.style.display = paused ? 'none' : '';
  if (pl) pl.style.display = paused ? '' : 'none';
  pausebtn.classList.toggle('on', paused);
}
function togglePause() {
  if (!running || over) return;                   // 未开局 / 已结算：忽略
  if (!paused) { paused = true; holdT = 0; }      // 暂停
  else { paused = false; holdT = 1.0; }           // 继续：先给 1 秒反应期
  syncPauseIcon();
}
/* 点击怎么触发：pointerdown 直接触发 togglePause，不再依赖 click
   （pointerdown 里 preventDefault 会抑制后续 click，手机端 touchstart 曾因此永远点不到）
   stopPropagation 必须保留，否则点按钮会同时带动底下的摇杆 */
if (window.PointerEvent) {
  pausebtn.addEventListener('pointerdown', function (e) {
    e.stopPropagation();
    e.preventDefault();
    togglePause();                       // 直接在这里触发，不再依赖 click
  }, { passive: false });
} else {
  pausebtn.addEventListener('touchstart', function (e) {
    e.stopPropagation();
    e.preventDefault();
    togglePause();
  }, { passive: false });
  pausebtn.addEventListener('mousedown', function (e) {
    e.stopPropagation();
    e.preventDefault();
    togglePause();
  });
}
/* 键盘可达性：按钮用 Tab 聚焦后回车 / 空格也能触发（游戏内 P / Esc 仍然有效） */
pausebtn.addEventListener('keydown', function (e) {
  if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); togglePause(); }
});
/* 页面切后台：回来时自动解除暂停并给 1 秒反应期，防止一回来就被在场的客机撞死 */
document.addEventListener('visibilitychange', function () {
  if (document.visibilityState !== 'hidden') return;
  if (!running || over) return;
  paused = false; holdT = 1.0;
  syncPauseIcon();
});

/* ---------------- §13 主循环 ---------------- */
function loop(now) {
  if (!running) return;
  // dt 上限 0.05s；rAF 时间戳可能略早于开帧时刻，故下限取 0（不允许时间为负）
  var dt = Math.min(DTMAX, Math.max(0, (now - last) / 1000));
  last = now;
  update(dt);
  draw();
  raf = requestAnimationFrame(loop);
}

function init() {
  cancelAnimationFrame(raf);
  ty = []; elapsed = 0; over = false; running = false; spawnT = 0; tyNo = 0; hit = null;
  paused = false; holdT = 0;               // 复位暂停态
  win = false; winT = 0; winShown = false; // 复位隐藏结局
  popup.classList.remove('win');           // 卡片配色回到（失败卡的）冷蓝
  if (pausebtn) { pausebtn.hidden = true; }
  syncPauseIcon();
  jp = { x: 199, y: 358 };               // 起点：世界贸易中心
  keys = {};
  release();
  popup.classList.remove('hide');
  sharebtn.hidden = true;
  ptitle.textContent = '8时46分';
  ptext.textContent = READY
    ? '拖动世贸双塔，避开从四面八方袭来的客机。\n你躲开的每一秒，都在替纽约走完今天的时刻。'
    : '载入中…';
  phint.hidden = !READY;
  pbtn.textContent = '开始';
  pbtn.disabled = !READY;
  draw();
}

function start() {
  if (!READY || running) return;
  keys = {}; release();                    // 清掉在开始弹窗上按下的方向键（预输入）
  if (over || win) init();                 // 重开：复位一切（含暂停态与隐藏结局）
  popup.classList.add('hide');
  phint.hidden = true;
  running = true;
  paused = false; holdT = 0;
  syncPauseIcon();
  pausebtn.hidden = false;                 // 开局后暂停键才出现
  spawn();
  last = performance.now();
  raf = requestAnimationFrame(loop);
}
pbtn.addEventListener('click', start);

/* ---------------- §10 分享 ---------------- */
sharebtn.addEventListener('click', function () {
  var text;
  if (win) {                                   // 隐藏结局：发的是「911 从未发生」
    var cw = gameClock(elapsed);
    text = '纽约的清晨依旧匆忙。\n' +
      '地铁里人们低头看报，咖啡杯冒着热气。\n' +
      '双子塔的影子斜斜铺在街道上，游客举着相机笑，街角的热狗摊排着队。\n' +
      '911从未发生—— 纽约，2001年9月11日 上午' + cw.h12 + '时' + pad2(cw.mm) + '分';
  } else {                                     // 失败结算：原文案，一个字不改
    if (!hit) return;
    var c = hit.clock, s = hit.site;
    var body = ptext.textContent;
    var line = '纽约，2001年9月11日 ' + c.h12 + '时' + pad2(c.mm) + '分 · ' + s.text;
    text = body + '\n—— ' + line;
  }
  if (navigator.share) {
    navigator.share({ title: '8时46分', text: text }).catch(function () {});
    return;
  }
  var done = function () {
    sharebtn.textContent = '已复制';
    setTimeout(function () { sharebtn.textContent = '分享'; }, 1500);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done, function () {});
  } else {
    var ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); done(); } catch (err) {}
    document.body.removeChild(ta);
  }
});

/* ---------------- 地图标注：底图已是实景照片，不再有地名叠字 ---------------- */

/* ---------------- 启动 ---------------- */
resize();
init();
loadArt();
})();
</script>
